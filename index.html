<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pulse</title>
<!-- iPhone "Add to Home Screen": full-screen app with its own icon -->
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* ---------- tokens (Apple Music-like, light + dark) ---------- */
:root{
  --bg:#ffffff; --bg2:#f2f2f7; --raised:#ffffff; --text:#000000; --muted:#8a8a8e; --faint:#c7c7cc;
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --accent:#fa2d48; --barbg:rgba(249,249,251,.86); --shadow:0 8px 28px rgba(0,0,0,.14);
  --radius:10px; --tab-h:50px; --mini-h:62px; --side-w:248px; --bar-h:80px;
  --sb:env(safe-area-inset-bottom); --st:env(safe-area-inset-top);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --bg2:#1c1c1e; --raised:#1c1c1e; --text:#ffffff; --muted:#98989f; --faint:#48484a;
    --sep:rgba(84,84,88,.5); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.32);
    --barbg:rgba(30,30,32,.86); --shadow:0 10px 34px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
svg{width:1em;height:1em;fill:currentColor;flex:none}
a{color:var(--accent);text-decoration:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100vh;height:100dvh}
main{overflow-y:auto;overflow-x:hidden;padding:28px 40px calc(var(--bar-h) + 40px);scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
main > .page{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* sidebar (Mac / wide screens) */
.side{background:var(--bg2);border-right:.5px solid var(--sep);padding:22px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;padding:0 10px 16px;letter-spacing:-.02em}
.brand img{width:30px;height:30px;border-radius:8px}
.side .sfield{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:9px;padding:7px 10px;color:var(--muted);margin:0 4px 14px;cursor:text}
.side .grp{font-size:12px;font-weight:600;color:var(--muted);padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:8px;font-weight:500;text-align:left;width:100%}
.nav svg{font-size:19px;color:var(--accent)}
.nav:hover{background:var(--fill)}
.nav.on{background:var(--fill2)}
.side .note{margin-top:auto;color:var(--muted);font-size:11.5px;line-height:1.5;padding:16px 12px 0}

/* mobile tab bar */
.tabbar{display:none}

/* ---------- typography & sections ---------- */
.lt{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:6px 0 18px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;border-top:.5px solid var(--sep);padding-top:14px}
.sh.first{border-top:0;padding-top:0;margin-top:4px}
.sh h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sh a,.sh button{color:var(--accent);font-size:15px;white-space:nowrap}
.sub{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px;letter-spacing:0}

/* cards & shelves */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:172px;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -40px;padding-left:40px;padding-right:40px;scroll-padding:40px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:22px 16px}
.card{text-align:left;min-width:0;scroll-snap-align:start}
.card .art{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:var(--fill);margin-bottom:8px;box-shadow:0 0 0 .5px var(--sep)}
.card .art img{width:100%;height:100%;object-fit:cover}
.card .play{position:absolute;left:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;font-size:15px;opacity:0;transition:.2s}
.card:hover .play{opacity:1}
.card .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

/* track rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,.6fr) 30px 30px 46px;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;text-align:left;width:100%;position:relative;cursor:pointer}
.row::after{content:"";position:absolute;left:68px;right:8px;bottom:0;border-bottom:.5px solid var(--sep)}
.row:last-child::after{display:none}
.row:hover{background:var(--fill)}
.row:active{background:var(--fill2)}
.row img{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--fill)}
.row .rt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ra{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .al{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.row.cur .rt{color:var(--accent);font-weight:600}
.row .eq{display:none}
.row.cur.playing .eq{display:flex}
.row .n{display:none}
.list.numbered .row{grid-template-columns:28px minmax(0,1fr) 30px 30px 46px}
.list.numbered .row::after{left:48px}
.list.numbered .row img,.list.numbered .row .al{display:none}
.list.numbered .row .n{display:block;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.list.numbered .row.cur .n{color:var(--accent)}
.ib{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--muted);font-size:17px}
.ib:hover{background:var(--fill2);color:var(--text)}
.heart{opacity:0}
.row:hover .heart,.heart.on{opacity:1}
.heart.on{color:var(--accent)}
.dlic{display:none;width:13px;height:13px;margin-right:5px;vertical-align:-2px;color:var(--muted)}
.row.dl .dlic.ok{display:inline-block}
.row.dling .dlic.spin{display:inline-block;border:2px solid var(--fill2);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.pill.icon{min-width:0;padding:11px 14px}
.yt{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:#e5202e;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.eq{position:absolute;left:8px;top:6px;width:48px;height:48px;border-radius:6px;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;gap:3px;padding-bottom:15px}
.eq i{width:3px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(1){height:10px;animation-delay:-.2s}.eq i:nth-child(2){height:16px}.eq i:nth-child(3){height:8px;animation-delay:-.45s}
.list.numbered .row .eq{display:none}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.eq i{transform-origin:bottom}

/* collection header (album / playlist) */
.hero{display:flex;gap:32px;align-items:flex-end;margin:6px 0 24px}
.hero img{width:232px;height:232px;border-radius:12px;object-fit:cover;box-shadow:var(--shadow);background:var(--fill)}
.hero .meta{min-width:0}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero .by{color:var(--accent);font-size:21px;margin-top:4px}
.hero .info{color:var(--muted);font-size:13px;margin-top:4px;text-transform:uppercase;letter-spacing:.02em;font-weight:500}
.btns{display:flex;gap:12px;margin-top:20px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:132px;padding:11px 22px;border-radius:10px;background:var(--fill);color:var(--accent);font-weight:600;font-size:16px}
.pill:hover{background:var(--fill2)}
.pill.solid{background:var(--accent);color:#fff}
.foot{color:var(--muted);font-size:13px;padding:16px 8px}

/* library segmented control */
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:18px}
.seg button{padding:6px 18px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* search */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.searchbox svg{color:var(--muted);font-size:17px}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;-webkit-user-select:text;user-select:text}
.searchbox input::placeholder{color:var(--muted)}
.searchbox .clear{color:var(--muted);font-size:17px;display:none}
.searchbox.has .clear{display:grid}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{position:relative;height:104px;border-radius:12px;padding:12px;text-align:left;color:#fff;font-weight:700;font-size:16px;overflow:hidden;display:flex;align-items:flex-end;box-shadow:inset 0 -40px 40px -30px rgba(0,0,0,.35)}
.tile::before{content:"";position:absolute;right:-18px;top:-18px;width:80px;height:80px;border-radius:18px;background:rgba(255,255,255,.18);transform:rotate(22deg)}
.tile:active{opacity:.85}

/* featured carousel (Top Picks) */
.feat{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(320px,32%);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -40px 6px;padding:0 40px 6px;scroll-padding:40px;scrollbar-width:none}
.feat::-webkit-scrollbar{display:none}
.fcard{scroll-snap-align:start;text-align:left;min-width:0}
.fcard .k{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.fcard .box{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--fill);box-shadow:0 0 0 .5px var(--sep)}
.fcard .box img.bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) saturate(1.6);transform:scale(1.3)}
.fcard .box img.cov{position:absolute;left:14%;top:9%;width:72%;aspect-ratio:1;border-radius:10px;object-fit:cover;box-shadow:0 14px 36px rgba(0,0,0,.4)}
.fcard .box .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.fcard .box .cap .t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .box .cap .s{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{position:relative;border-radius:16px;overflow:hidden;padding:22px 20px;margin:4px 0 8px;color:#fff;background:linear-gradient(135deg,#ff2d55,#ff9500 55%,#ffcc00)}
.banner h3{font-size:24px;font-weight:800;letter-spacing:-.02em}
.banner p{opacity:.9;font-size:14px;margin-top:4px;max-width:420px}
.banner .btns{margin-top:14px}
.banner .pill{background:rgba(255,255,255,.95);color:#e5202e}
/* lyrics */
.np .lyrics{display:none;flex:1;min-height:0;overflow-y:auto;margin:14px -6px 6px;padding:20px 6px 40vh;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(transparent,#000 8%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 8%,#000 80%,transparent)}
.np.showly .stage,.np.showly .queue{display:none}
.np.showly .lyrics{display:block}
.lyrics .ln{display:block;width:100%;text-align:left;font-size:27px;font-weight:800;line-height:1.28;letter-spacing:-.01em;color:rgba(255,255,255,.32);padding:7px 0;transition:color .25s}
.lyrics .ln.on{color:#fff}
.lyrics .ln.gap{min-height:22px}
.lyrics .plain{white-space:pre-wrap;font-size:21px;font-weight:700;line-height:1.45;color:rgba(255,255,255,.9)}
.lyrics .src{font-size:12px;color:rgba(255,255,255,.5);padding-top:18px}
.lyrics .none{color:rgba(255,255,255,.6);font-size:17px;padding-top:30%;text-align:center}
/* skeletons */
.sk{background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 37%,var(--fill) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:var(--radius)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{color:var(--muted);padding:40px 8px;text-align:center;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:4px}

/* ---------- player bar (wide) / mini player (phone) ---------- */
.bar{position:fixed;left:var(--side-w);right:0;bottom:0;height:var(--bar-h);background:var(--barbg);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--sep);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:20px;padding:0 22px;z-index:5}
.bar .now{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.bar .now img{width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--fill);box-shadow:0 0 0 .5px var(--sep);flex:none}
.bar .now .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .now .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.ctl{display:flex;align-items:center;gap:24px}
.ctl button{display:grid;place-items:center;color:var(--text);font-size:22px}
.ctl .sm{font-size:16px;color:var(--muted)}
.ctl .sm.on{color:var(--accent)}
.ctl .pp{font-size:30px}
.scrub{display:flex;align-items:center;gap:10px;width:100%;max-width:520px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.scrub span{width:38px;text-align:center}
.bar .right{display:flex;align-items:center;justify-content:flex-end;gap:14px;color:var(--muted)}
.bar .right button{font-size:18px;display:grid;place-items:center}
.bar .right button:hover,.bar .right button.on{color:var(--text)}
.bar .right #barLove.on{color:var(--accent)}
.bar .mini-ctl,.bar .prog{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(to right,var(--muted) var(--p,0%),var(--fill2) var(--p,0%));outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);opacity:0;transition:.15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}
.right input[type=range]{max-width:100px}

/* ---------- Now Playing (full screen) ---------- */
.np{position:fixed;inset:0;z-index:20;color:#fff;transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s linear .42s;overflow:hidden;background:#111;visibility:hidden}
.np.open{transform:none;visibility:visible;transition-delay:0s}
.np .bg{position:absolute;inset:0;overflow:hidden}
.np .bg img{position:absolute;width:160%;height:160%;left:-30%;top:-30%;object-fit:cover;filter:blur(70px) saturate(1.7);opacity:.9;animation:drift 38s linear infinite}
.np .bg img+img{animation-duration:52s;animation-direction:reverse;opacity:.55;mix-blend-mode:screen}
.np .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.42))}
@keyframes drift{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.np .in{position:relative;height:100%;display:flex;flex-direction:column;max-width:460px;margin:0 auto;padding:calc(var(--st) + 10px) 26px calc(var(--sb) + 18px)}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.45);margin:4px auto 0;flex:none}
.np .close{position:absolute;top:calc(var(--st) + 14px);right:18px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:none;place-items:center;font-size:16px}
.np .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px 0}
.np .art{width:100%;max-width:400px;aspect-ratio:1;border-radius:12px;object-fit:cover;box-shadow:0 24px 60px rgba(0,0,0,.45);background:rgba(255,255,255,.08)}
.np .queue{display:none;flex:1;min-height:0;overflow-y:auto;margin:14px -10px 6px;padding:0 10px}
.np.showq .stage{display:none}
.np.showq .queue{display:block}
.np .queue h3{font-size:17px;display:flex;justify-content:space-between;align-items:center;padding:6px 0 4px}
.np .queue .qsub{font-size:13px;color:rgba(255,255,255,.6);padding-bottom:10px}
.np .queue .row{grid-template-columns:44px minmax(0,1fr) 42px}
.np .queue .row img{width:44px;height:44px}
.np .queue .row::after{left:64px;border-color:rgba(255,255,255,.14)}
.np .queue .row .ra,.np .queue .row .d{color:rgba(255,255,255,.6)}
.np .queue .row:hover{background:rgba(255,255,255,.1)}
.np .queue .row.cur .rt{color:#fff}
.np .toggles{display:flex;gap:8px}
.np .toggles button{width:34px;height:28px;border-radius:7px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:15px;color:rgba(255,255,255,.8)}
.np .toggles button.on{background:#fff;color:#000}
.np .meta{display:flex;align-items:center;gap:12px;margin-top:6px}
.np .lyline{display:block;width:100%;text-align:left;margin-top:10px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.12);font-size:15px;font-weight:600;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:38px}
.np .lyline:empty{display:none}
.np .lyline .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.6);margin-right:8px}
.np.showly .lyline{display:none}
.np .art{cursor:pointer}
.np .foot2 .lyb{width:auto;padding:0 12px;gap:6px;display:flex;align-items:center;font-size:13px;font-weight:600}
.np .foot2 .lyb svg{font-size:18px}
.np .meta .txt{flex:1;min-width:0}
.np .meta .t{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .meta .a{font-size:19px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .roundb{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:16px;flex:none}
.np .roundb.on{color:var(--accent);background:#fff}
.np .scrub{max-width:none;color:rgba(255,255,255,.6);margin-top:18px;flex-direction:column;align-items:stretch;gap:6px}
.np .scrub .times{display:flex;justify-content:space-between;align-items:center}
.np .scrub span{width:auto}
.np input[type=range]{height:6px;background:linear-gradient(to right,rgba(255,255,255,.85) var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}
.np input[type=range]::-webkit-slider-thumb{opacity:0}
.np .q{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.16);color:rgba(255,255,255,.8)}
.np .ctl{justify-content:space-around;margin:18px 6px 10px;gap:0}
.np .ctl button{color:#fff;font-size:40px}
.np .ctl .pp{font-size:56px}
.np .ctl button:active{opacity:.6}
.np .foot2{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 0;color:rgba(255,255,255,.65)}
.np .foot2 button{font-size:22px;display:grid;place-items:center;width:44px;height:36px;border-radius:9px}
.np .foot2 button.on{background:rgba(255,255,255,.2);color:#fff}
.np .foot2 .note{font-size:11px;letter-spacing:.02em}

/* action sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:calc(16px + var(--sb));width:min(420px,calc(100% - 16px));transform:translate(-50%,120%);z-index:31;transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet .box{background:var(--barbg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:14px;overflow:hidden;margin-bottom:8px}
.sheet .head{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:.5px solid var(--sep)}
.sheet .head img{width:44px;height:44px;border-radius:6px;object-fit:cover}
.sheet .head .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .head .a{color:var(--muted);font-size:13px}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;font-size:16px;border-bottom:.5px solid var(--sep);text-align:left}
.sheet .opt:last-child{border-bottom:0}
.sheet .opt svg{font-size:19px;color:var(--accent)}
.sheet .opt:active{background:var(--fill)}
.sheet .cancel{display:block;width:100%;padding:15px;border-radius:14px;background:var(--raised);font-weight:600;font-size:17px;color:var(--accent)}

.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:var(--barbg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:20px 26px;border-radius:16px;font-size:15px;font-weight:600;text-align:center;opacity:0;transition:.2s;pointer-events:none;z-index:40;min-width:160px;box-shadow:var(--shadow)}
.toast svg{display:block;margin:0 auto 8px;font-size:40px;color:var(--accent)}
.toast.show{opacity:1;transform:translate(-50%,-50%)}

/* ---------- phone layout ---------- */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(var(--st) + 14px) 16px calc(var(--tab-h) + var(--mini-h) + var(--sb) + 40px)}
  .lt{font-size:32px;margin-bottom:14px}
  .shelf{grid-auto-columns:150px;gap:12px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .feat{grid-auto-columns:78%;gap:12px;margin:0 -16px 6px;padding:0 16px 6px;scroll-padding:16px}
  .lyrics .ln{font-size:25px}
  .card .play{display:none}
  .row{grid-template-columns:48px minmax(0,1fr) auto auto;padding:6px 0}
  .row::after{left:60px;right:0}
  .row .al,.row .d{display:none}
  .row:hover{background:none}
  .heart{opacity:1;display:none}
  .heart.on{display:grid}
  .list.numbered .row{grid-template-columns:28px minmax(0,1fr) auto auto}
  .list.numbered .row::after{left:40px}
  .eq{left:0}
  .hero{flex-direction:column;align-items:center;text-align:center;gap:14px}
  .hero img{width:min(240px,64vw);height:auto;aspect-ratio:1}
  .hero h1{font-size:22px}
  .hero .by{font-size:20px}
  .btns{justify-content:center;width:100%}
  .btns .pill{flex:1;min-width:0}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--sb));padding-bottom:var(--sb);background:var(--barbg);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--sep);z-index:6}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted)}
  .tabbar svg{font-size:24px}
  .tabbar button.on{color:var(--accent)}
  .bar{left:8px;right:8px;bottom:calc(var(--tab-h) + var(--sb) + 8px);height:var(--mini-h);border-radius:14px;border:.5px solid var(--sep);grid-template-columns:minmax(0,1fr) auto;padding:0 6px 0 8px;gap:6px;box-shadow:var(--shadow);overflow:hidden}
  .bar .now img{width:46px;height:46px}
  .bar .mid,.bar .right{display:none}
  .bar .mini-ctl{display:flex;align-items:center}
  .bar .mini-ctl button{width:42px;height:42px;display:grid;place-items:center;font-size:24px}
  .bar .prog{display:block;position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--fill)}
  .bar .prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
  .np .close{display:none}
  .toast{top:auto;bottom:calc(var(--tab-h) + var(--mini-h) + var(--sb) + 30px);transform:translate(-50%,10px)}
  .toast.show{transform:translate(-50%,0)}
}
@media (min-width:821px){
  .np.showly .stage{display:none}
  .np .lyrics{flex:1.1;height:min(78vh,640px)}
  .np .in{max-width:1100px;flex-direction:row;align-items:center;gap:60px;padding:48px 60px}
  .np .grab{display:none}
  .np .close{display:grid}
  .np .stage,.np .queue{flex:1.1;height:min(78vh,640px)}
  .np .side2{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .np.showq .stage{display:flex}
  .np.showq .queue{display:block;position:absolute;right:24px;top:70px;bottom:24px;width:360px;background:rgba(0,0,0,.35);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;margin:0;padding:10px 14px}
}
@media (prefers-reduced-motion: reduce){ .np .bg img{animation:none} *{transition-duration:.01ms !important} }
</style>

<script>if (window.TUNE_APP) document.write('<script src="engine.js"><\/script><script src="app-bridge.js"><\/script>');</script>
<script>
const APP = window.TuneApp || null; // set when running inside the iPhone app
const DL = APP?.downloads?.enabled ? APP.downloads : null; // offline downloads (iPhone app only)
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const view = $('#view'), audio = APP ? APP.audio : $('#audio');
const ICON = {
  play: '<path d="M7 4.5v15l12.5-7.5z"/>',
  pause: '<path d="M6 4h4.5v16H6zm7.5 0H18v16h-4.5z"/>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3C19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/></svg>',
  more: '<svg viewBox="0 0 24 24"><path d="M5 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm14-2v6l5-3z"/></svg>',
  radio: '<svg viewBox="0 0 24 24"><path d="M12 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM7.8 7.8l1.4 1.4a4 4 0 0 0 0 5.6l-1.4 1.4a6 6 0 0 1 0-8.4zm8.4 0a6 6 0 0 1 0 8.4l-1.4-1.4a4 4 0 0 0 0-5.6zM5 5l1.4 1.4a8 8 0 0 0 0 11.2L5 19A10 10 0 0 1 5 5zm14 0a10 10 0 0 1 0 14l-1.4-1.4a8 8 0 0 0 0-11.2z"/></svg>',
  later: '<svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm16-3h2v3h3v2h-3v3h-2v-3h-3v-2h3z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
  download: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1 5v6.2L8.4 10.6 7 12l5 5 5-5-1.4-1.4-2.6 2.6V7z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7z"/></svg>',
  chev: '<svg viewBox="0 0 24 24" style="font-size:13px;vertical-align:-1px"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg>',
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// iPhone/iPad Safari or any browser without WebM/Opus → ask the Mac server for AAC.
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const FMT = (IOS || !document.createElement('audio').canPlayType('audio/webm; codecs="opus"')) ? '?f=aac' : '';
const sm = u => (u || '').replace(/(%3D|=)w544-h544/, '$1w120-h120');
const abs = u => u && u.startsWith('/') ? location.origin + u : u;
const fmt = s => isFinite(s) && s >= 0 ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';
const api = p => APP ? APP.api(p) : fetch(p).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
if (APP) $('#brandIcon').src = 'icon-180.png';

// ---- local, account-free storage ----
const store = APP ? APP.store : {
  get(k, d) { try { return JSON.parse(localStorage.getItem('tune.'+k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tune.'+k, JSON.stringify(v)); } catch {} },
};
let liked = store.get('liked', []), recent = store.get('recent', []);
const isLiked = id => liked.some(t => t.id === id);
function toggleLike(t) {
  liked = isLiked(t.id) ? liked.filter(x => x.id !== t.id) : [t, ...liked];
  store.set('liked', liked);
  $$(`.heart[data-id="${t.id}"]`).forEach(h => h.classList.toggle('on', isLiked(t.id)));
  syncLikeNow(); toast(isLiked(t.id) ? 'Loved' : 'Removed from Loved Songs', isLiked(t.id) ? ICON.heart : '');
}
function toast(m, icon = '') { const t = $('#toast'); t.innerHTML = icon + esc(m); t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1500); }

// ---- player state ----
let queue = [], idx = -1, shuffle = false, repeat = false, fetchingMore = false;
const cur = () => queue[idx];

function playList(list, start = 0, autoplayRadio = true) {
  queue = list.slice(); idx = start; load(); if (autoplayRadio && list.length < 5) extendWithRadio();
}
async function extendWithRadio() {
  const seed = queue[queue.length - 1] || cur(); if (!seed || fetchingMore) return;
  fetchingMore = true;
  try {
    const recs = await api('/api/radio/' + seed.id);
    const have = new Set(queue.map(t => t.id));
    queue.push(...recs.filter(t => !have.has(t.id)));
    renderQueue(); APP?.syncUpcoming();
  } catch {} finally { fetchingMore = false; }
}
function insertNext(t) { if (!cur()) return playList([t]); queue.splice(idx + 1, 0, { ...t }); renderQueue(); APP?.syncUpcoming(); toast('Playing Next', ICON.check); }
function addLater(t) { if (!cur()) return playList([t]); queue.push({ ...t }); renderQueue(); APP?.syncUpcoming(); toast('Added to Queue', ICON.check); }
function startRadio(t) { playList([t]); toast('Station started', ICON.radio); }

function load() {
  const t = cur(); if (!t) return;
  if (APP) APP.start(); else { audio.src = '/api/stream/' + t.id + FMT; audio.play().catch(() => {}); }
  showTrack();
}
function showTrack() {
  const t = cur(); if (!t) return;
  $('#barArt').src = sm(t.art) || ''; $('#barT').textContent = t.title; $('#barA').textContent = t.artist;
  $('#npArt').src = t.art || ''; $('#npBg1').src = t.art || ''; $('#npBg2').src = t.art || '';

  $('#qual').textContent = '…';
  api('/api/info/' + t.id + FMT).then(i => $('#qual').textContent = `${(i.codec||'').toUpperCase()} ${i.kbps} KBPS`).catch(() => $('#qual').textContent = '—');
  recent = [t, ...recent.filter(x => x.id !== t.id)].slice(0, 60); store.set('recent', recent);

function next(auto = false) {

}

// ---- lyrics (synced when available) ----
const lyCache = new Map();
let lyFor = null, lyLines = null, lyIdx = -1;
async function loadLyrics() {
  const t = cur(), box = $('#npLyrics'); if (!t || !box) return;
  if (lyFor === t.id) return;
  lyFor = t.id; lyLines = null; lyIdx = -1;
  box.innerHTML = '<div class="none">Loading lyrics…</div>';
  $('#npLyLine').innerHTML = '';
  try {
    let l = lyCache.get(t.id) || store.get('ly.' + t.id, null);
    if (!l) {
      l = await api(`/api/lyrics/${encodeURIComponent(t.id)}?` + new URLSearchParams({ title: t.title, artist: t.artist || '', dur: t.duration || '' }));
      if (l.synced || l.plain) { lyCache.set(t.id, l); if (DL?.has(t.id)) store.set('ly.' + t.id, l); } // keep lyrics for offline songs
    }
    if (lyFor !== t.id) return;
    if (l.synced?.length) {
      lyLines = l.synced;
      box.innerHTML = l.synced.map((x, i) => `<button class="ln${x.text ? '' : ' gap'}" data-i="${i}">${esc(x.text) || ''}</button>`).join('') + `<div class="src">Lyrics: ${esc(l.source)}</div>`;
      syncLyrics(true);
    } else if (l.plain) {
      box.innerHTML = `<div class="plain">${esc(l.plain)}</div><div class="src">Lyrics: ${esc(l.source)}</div>`;
      $('#npLyLine').innerHTML = `<span class="lbl">LYRICS</span>${esc(l.plain.split('\n').find(x => x.trim()) || '')}`;
    } else box.innerHTML = '<div class="none">No lyrics available for this song.</div>';
  } catch { if (lyFor === t.id) { lyFor = null; $('#npLyrics').innerHTML = '<div class="none">Couldn’t load lyrics.</div>'; } }
}
function syncLyrics(force = false) {
  if (!lyLines) return;
  const t = audio.currentTime + 0.25;
  let i = lyLines.length - 1; while (i >= 0 && lyLines[i].t > t) i--;
  if (i === lyIdx && !force) return;
  lyIdx = i;
  // live line under the title (find the nearest non-empty line)
  let j = Math.max(0, i); while (j < lyLines.length - 1 && !lyLines[j].text) j++;
  $('#npLyLine').innerHTML = lyLines[j]?.text ? `<span class="lbl">LYRICS</span>${esc(lyLines[j].text)}` : '';
  if (!np.classList.contains('showly')) return;
  const els = $$('#npLyrics .ln');
  els.forEach((e, j) => e.classList.toggle('on', j === i));
  const el = els[Math.max(0, i)]; const box = $('#npLyrics');
  if (el) box.scrollTo({ top: el.offsetTop - box.clientHeight * 0.3, behavior: force ? 'auto' : 'smooth' });
}

async function loadFeeds() {
  if (Date.now() - homeAt > HOME_TTL) { homeCache = exploreCache = null; }

    [homeCache, exploreCache] = await Promise.all([

function renderSearch() {
  view.innerHTML = page(`<div class="lt">Search</div><label class="searchbox${lastQ ? ' has' : ''}" id="sbox"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input id="q" type="search" placeholder="Artists, Songs, Albums and more" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" value="${esc(lastQ)}">
    <button class="clear" id="qClear" type="button" aria-label="Clear"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm3.5 5.1L12 10.6 8.5 7.1 7.1 8.5l3.5 3.5-3.5 3.5 1.4 1.4 3.5-3.5 3.5 3.5 1.4-1.4-3.5-3.5 3.5-3.5z"/></svg></button></label><div id="res"></div>`);
  const q = $('#q');
  if (!IOS || lastQ) q.focus();
  let t; q.addEventListener('input', () => { $('#sbox').classList.toggle('has', !!q.value); clearTimeout(t); t = setTimeout(() => doSearch(q.value), 350); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(t); doSearch(q.value); q.blur(); } });
  $('#qClear').onclick = () => { q.value = ''; $('#sbox').classList.remove('has'); doSearch(''); q.focus(); };
  doSearch(lastQ);
}
function browse() {
  const moods = (exploreCache?.moods?.length ? exploreCache.moods : FALLBACK_MOODS).slice(0, 24);
  return head('Browse Categories', '', true) + '<div class="tiles"><button class="tile" data-go2="telugu" style="background:linear-gradient(135deg,#ff2d55,#ff9500)">Telugu Beats</button>' + moods.map((m, i) =>
    `<button class="tile" data-q="${esc(m)} music" style="background:linear-gradient(135deg,${TILE_COLORS[i % TILE_COLORS.length]})">${esc(m)}</button>`).join('') + '</div>';
}
async function doSearch(q) {
  lastQ = q; const res = $('#res'); if (!res) return;
  if (!q.trim()) { res.innerHTML = browse(); if (!exploreCache) loadFeeds().then(() => { if (!lastQ.trim() && $('#res')) $('#res').innerHTML = browse(); }).catch(() => {}); return; }
  res.innerHTML = skRows(8);
  try {
    const r = await api('/api/search?q=' + encodeURIComponent(q));
    if (lastQ !== q) return;
    const songs = r.songs.length ? head('Songs', '', true) + rows(r.songs, { single: true }) : '';
    const albums = r.albums.length ? head('Albums') + '<div class="shelf">' + r.albums.map(cardHtml).join('') + '</div>' : '';
    const yt = (r.youtube || []).length ? head('From YouTube <span class="sub">not on YouTube Music</span>', '', !r.songs.length) + rows(r.youtube, { single: true }) : '';
    // If YouTube Music has nothing, lead with the YouTube results.
    res.innerHTML = (r.songs.length ? songs + albums + yt : yt + albums) || `<div class="empty"><b>No Results</b>Try a new search.</div>`;
    markCurrent();
  } catch { res.innerHTML = '<div class="empty"><b>Search failed</b>Check your connection and try again.</div>'; }
}
let libTab = 'songs';
function renderLib() {
  if (libTab === 'downloads' && !DL) libTab = 'songs';
  const list = libTab === 'songs' ? liked : libTab === 'downloads' ? DL.list() : recent;
  const empty = libTab === 'songs'
    ? '<div class="empty"><b>No Loved Songs yet</b>Tap ♥ on any song to save it here.</div>'
    : libTab === 'downloads'
    ? '<div class="empty"><b>No downloads yet</b>Tap ••• on any song and choose Download to listen without internet.</div>'
    : '<div class="empty"><b>Nothing played yet</b>Songs you play will appear here.</div>';
  view.innerHTML = page(`<div class="lt">Library</div>
    <div class="seg"><button data-t="songs" class="${libTab === 'songs' ? 'on' : ''}">Loved Songs</button><button data-t="recent" class="${libTab === 'recent' ? 'on' : ''}">Recent</button>${DL ? `<button data-t="downloads" class="${libTab === 'downloads' ? 'on' : ''}">Downloaded</button>` : ''}</div>
    ${list.length ? `<div class="btns" style="margin:0 0 18px"><button class="pill" id="pa"><svg viewBox="0 0 24 24">${ICON.play}</svg>Play</button><button class="pill" id="sa"><svg viewBox="0 0 24 24"><path d="M14.8 4H20v5.2l-1.9-1.9L5.4 20 4 18.6 16.7 5.9zM4 5.4 5.4 4l5.1 5.1-1.4 1.4zm11.2 10.2 1.4-1.4 1.5 1.5L20 14v6h-6l1.8-1.8z"/></svg>Shuffle</button>${DL && libTab === 'songs' ? `<button class="pill icon" id="dla" aria-label="Download all">${ICON.download}</button>` : ''}</div>` : ''}
    ${rows(list) || empty}
    ${list.length ? `<div class="foot">${list.length} song${list.length === 1 ? '' : 's'} · ${libTab === 'downloads' ? mb(DL.bytes()) + ' on this iPhone · plays without internet' : 'stored only on this device'}</div>` : ''}`);
  const dla = $('#dla'); if (dla) dla.onclick = async () => { const n = await DL.downloadMany(liked); toast(n ? `Downloading ${n} song${n === 1 ? '' : 's'}…` : 'All Loved Songs are downloaded', ICON.download); };
  $$('.seg button').forEach(b => b.onclick = () => { libTab = b.dataset.t; renderLib(); });
  if (list.length) { $('#pa').onclick = () => playList(list, 0, false); $('#sa').onclick = () => playList([...list].sort(() => Math.random() - .5), 0, false); }
  markCurrent();
}
async function renderCollection(kind, id) {
  view.innerHTML = page(`<div class="hero"><div class="sk" style="width:232px;height:232px;border-radius:12px"></div></div>${skRows(8)}`);
  try {
    const c = await api(`/api/collection/${kind}/${encodeURIComponent(id)}`);
    if (!onPage('album', 'playlist')) return;
    const mins = Math.round(c.tracks.reduce((s, t) => { const [m, sec] = (t.duration || '0:0').split(':').map(Number); return s + (m || 0) * 60 + (sec || 0); }, 0) / 60);
    view.innerHTML = page(`<div class="hero"><img src="${esc(c.art)}" alt=""><div class="meta"><h1>${esc(c.title)}</h1>
      <div class="by">${esc(c.artist) || (kind === 'playlist' ? 'Playlist' : '')}</div>
      <div class="info">${kind}${c.year ? ' · ' + esc(c.year) : ''}</div>
      <div class="btns"><button class="pill" id="pa"><svg viewBox="0 0 24 24">${ICON.play}</svg>Play</button><button class="pill" id="sa"><svg viewBox="0 0 24 24"><path d="M14.8 4H20v5.2l-1.9-1.9L5.4 20 4 18.6 16.7 5.9zM4 5.4 5.4 4l5.1 5.1-1.4 1.4zm11.2 10.2 1.4-1.4 1.5 1.5L20 14v6h-6l1.8-1.8z"/></svg>Shuffle</button>${DL ? `<button class="pill icon" id="dla" aria-label="Download">${ICON.download}</button>` : ''}</div></div></div>`
      + rows(c.tracks, { numbered: kind === 'album' })
      + `<div class="foot">${c.tracks.length} song${c.tracks.length === 1 ? '' : 's'}${mins ? `, ${mins} minutes` : ''}</div>`);
    $('#pa').onclick = () => playList(c.tracks, 0);
    $('#sa').onclick = () => { setShuffle(false); playList([...c.tracks].sort(() => Math.random() - .5), 0); };
    const dla = $('#dla'); if (dla) dla.onclick = async () => { const n = await DL.downloadMany(c.tracks); toast(n ? `Downloading ${n} song${n === 1 ? '' : 's'}…` : 'Already downloaded', ICON.download); };
    markCurrent();
  } catch { view.innerHTML = page('<div class="empty"><b>Couldn’t load this</b>Check your connection and try again.</div>'); }
}
function renderQueue() {
  const el = $('#qList'), up = queue.slice(idx);
  el.innerHTML = up.map((t, i) => `<div class="row ${i === 0 ? 'cur' : ''}" role="button" data-q="${idx + i}"><img decoding="async" loading="lazy" src="${esc(sm(t.art))}" alt="">
    <div style="min-width:0"><div class="rt">${esc(t.title)}</div><div class="ra">${esc(t.artist)}</div></div><span class="d">${esc(t.duration || '')}</span></div>`).join('');
}
$('#qList').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) { idx = +r.dataset.q; load(); } });

function route() {
  const [, a, b] = location.hash.split('/');
  const tab = a === 'recent' ? (libTab = 'recent', 'library') : (a || 'home');
  if (a === 'library') libTab = libTab || 'songs';
  $$('.nav,.tabbar button').forEach(n => n.classList.toggle('on', n.dataset.go === (a || 'home') || (n.closest('.tabbar') && n.dataset.go === tab)));
  view.scrollTop = 0; closeMenu();
  if (a === 'search') renderSearch();
  else if (a === 'library' || a === 'recent') renderLib();
  else if (a === 'new') renderNew();
  else if (a === 'telugu') renderTelugu();
  else if (a === 'album' || a === 'playlist') renderCollection(a, decodeURIComponent(b));
  else renderHome();
}
$$('[data-go]').forEach(n => n.onclick = () => {
  if (n.dataset.go === 'library' && libTab !== 'downloads') libTab = 'songs';
  const h = '#/' + n.dataset.go; if (location.hash === h) { view.scrollTo({ top: 0 }); if (h === '#/search') $('#q')?.focus(); } else location.hash = h;
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>

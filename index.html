<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tune</title>
<!-- iPhone "Add to Home Screen": full-screen app with its own icon -->
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tune">
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --panel:#141417; --panel2:#1c1c21; --line:#26262c;
  --text:#f4f4f6; --muted:#9a9aa3; --accent:#fa2d48; --accent2:#ff6b81;
  --radius:12px; --player-h:88px; --side-w:232px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
svg{width:1em;height:1em;fill:currentColor}
.app{display:grid;grid-template-columns:var(--side-w) 1fr;grid-template-rows:1fr var(--player-h);height:100vh}

/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 10px 22px;letter-spacing:-.02em}
.brand i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#a42bff);display:grid;place-items:center;font-style:normal;font-size:16px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav svg{font-size:18px}
.nav:hover{color:var(--text);background:var(--panel2)}
.nav.on{color:var(--text);background:var(--panel2)}
.nav.on svg{color:var(--accent)}
.side .note{margin-top:auto;color:var(--muted);font-size:11.5px;line-height:1.5;padding:12px}

/* main */
main{overflow-y:auto;padding:28px 36px 40px;scroll-behavior:smooth}
h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-bottom:22px}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:30px 0 14px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-width:560px;margin-bottom:10px}
.searchbox input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px}
.searchbox svg{color:var(--muted);font-size:18px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:168px;gap:18px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px}
.card{text-align:left;min-width:0}
.card .art{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:var(--panel2);margin-bottom:10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card .art img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .art img{transform:scale(1.04)}
.card .play{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.2s;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.card:hover .play{opacity:1;transform:none}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* track list */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 44px minmax(0,1fr) minmax(0,.7fr) 34px 54px;align-items:center;gap:14px;padding:7px 10px;border-radius:8px;text-align:left;width:100%}
.row:hover{background:var(--panel2)}
.row.cur .rt{color:var(--accent)}
.row .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row img{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--panel2)}
.row .rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ra{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .al{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.heart{color:var(--muted);font-size:17px;display:grid;place-items:center;opacity:.0}
.row:hover .heart,.heart.on{opacity:1}
.heart.on{color:var(--accent)}

.hero{display:flex;gap:28px;align-items:flex-end;margin-bottom:26px}
.hero img{width:220px;height:220px;border-radius:14px;object-fit:cover;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.hero .k{text-transform:uppercase;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.hero h1{margin:6px 0 6px;font-size:40px}
.hero .by{color:var(--accent2);font-weight:600;font-size:17px}
.btns{display:flex;gap:10px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:999px;background:var(--accent);font-weight:700}
.pill.ghost{background:var(--panel2)}
.empty{color:var(--muted);padding:40px 0}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 14px}
.h2row h2{margin:0}
.pill.sm{padding:7px 14px;font-size:13px}
.yt{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:#d4202f;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
h2 .sub2{font-size:13px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite;margin:60px auto}
@keyframes s{to{transform:rotate(360deg)}}

/* player bar */
.player{grid-column:1/-1;background:rgba(20,20,23,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;padding:0 20px;gap:20px}
.np{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.np img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--panel2);flex:none}
.np .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctl{display:flex;align-items:center;gap:22px}
.ctl button{color:var(--muted);font-size:18px;display:grid;place-items:center}
.ctl button:hover{color:var(--text)}
.ctl button.on{color:var(--accent)}
.ctl .pp{width:40px;height:40px;border-radius:50%;background:var(--text);color:#000;font-size:18px}
.ctl .pp:hover{color:#000;transform:scale(1.05)}
.prog{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog span{width:38px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(to right,var(--text) var(--p,0%),#3a3a42 var(--p,0%));outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0;transition:.15s}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]:hover{background:linear-gradient(to right,var(--accent) var(--p,0%),#3a3a42 var(--p,0%))}
.rt-side{display:flex;align-items:center;justify-content:flex-end;gap:16px;color:var(--muted)}
.rt-side button{font-size:18px;display:grid;place-items:center}
.rt-side button:hover,.rt-side button.on{color:var(--text)}
.rt-side input{max-width:110px}
.q{font-size:10.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--muted);white-space:nowrap}

/* queue drawer */
.drawer{position:fixed;top:0;right:0;bottom:var(--player-h);width:360px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:22px 14px;z-index:5}
.drawer.open{transform:none}
.drawer h3{font-size:17px;padding:0 10px 4px}
.drawer .sub{color:var(--muted);font-size:12px;padding:0 10px 14px}
.drawer .row{grid-template-columns:44px minmax(0,1fr) 54px}

/* full-screen now playing */
.full{position:fixed;inset:0;z-index:10;display:none;overflow:hidden}
.full.open{display:block}
.full .bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.4) brightness(.55);transform:scale(1.2)}
.full .in{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding:40px}
.full .big{width:min(46vh,440px);aspect-ratio:1;border-radius:18px;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.full .meta{width:min(420px,40vw)}
.full .meta .t{font-size:30px;font-weight:800;letter-spacing:-.02em}
.full .meta .a{font-size:18px;color:rgba(255,255,255,.7);margin:6px 0 30px}
.full .prog{max-width:none}
.full .ctl{justify-content:center;margin-top:22px;gap:34px}
.full .ctl button{font-size:24px;color:rgba(255,255,255,.8)}
.full .ctl .pp{width:64px;height:64px;font-size:26px}
.full .close{position:absolute;top:22px;left:24px;font-size:26px;z-index:2;color:rgba(255,255,255,.8)}

.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + 18px);transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

@media (max-width:820px){
  /* respect the iPhone notch / Dynamic Island and home-indicator bar */
  :root{--side-w:0px;--player-h:calc(132px + env(safe-area-inset-bottom))}
  .player{padding-bottom:calc(10px + env(safe-area-inset-bottom)) !important}
  main{padding-top:calc(20px + env(safe-area-inset-top)) !important}
  .full .close{top:calc(22px + env(safe-area-inset-top))}
  .app{height:100dvh}
  button,.row{-webkit-tap-highlight-color:transparent}
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:var(--player-h);left:0;right:0;flex-direction:row;padding:6px 8px;z-index:4;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
  .side .brand,.side .note{display:none}
  .nav{flex-direction:column;gap:3px;font-size:11px;padding:6px;width:auto}
  main{padding:20px 16px 90px}
  .player{grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:10px 16px;gap:8px}
  .ctr{grid-column:1/-1;grid-row:2}
  .rt-side input,.rt-side .q{display:none}
  .row{grid-template-columns:44px minmax(0,1fr) 34px 46px}
  .row .n,.row .al{display:none}
  .hero{flex-direction:column;align-items:flex-start}
  .hero img{width:160px;height:160px}
  .hero h1{font-size:28px}
  .full .in{flex-direction:column;gap:28px}
  .full .meta{width:100%}
  .drawer{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i>♪</i>Tune</div>
    <button class="nav" data-go="home"><svg viewBox="0 0 24 24"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</button>
    <button class="nav" data-go="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>Search</button>
    <button class="nav" data-go="library"><svg viewBox="0 0 24 24"><path d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3C19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/></svg>Library</button>
    <button class="nav" data-go="recent"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2 4.9l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></svg>Recent</button>
    <div class="note">No ads. No account. Everything you like is stored only on this device.</div>
  </aside>

  <main id="view"></main>

  <footer class="player">
    <button class="np" id="npOpen" title="Now playing">
      <img id="npArt" alt="">
      <div style="min-width:0"><div class="t" id="npT">Nothing playing</div><div class="a" id="npA">Search for a song to start</div></div>
    </button>
    <div class="ctr">
      <div class="ctl">
        <button id="shuf" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M14.8 4H20v5.2l-1.9-1.9L5.4 20 4 18.6 16.7 5.9zM4 5.4 5.4 4l5.1 5.1-1.4 1.4zm11.2 10.2 1.4-1.4 1.5 1.5L20 14v6h-6l1.8-1.8z"/></svg></button>
        <button id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
        <button class="pp" id="pp" title="Play/Pause (Space)"><svg id="ppI" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9.5-12h2v12h-2z"/></svg></button>
        <button id="rep" title="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
      </div>
      <div class="prog"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    </div>
    <div class="rt-side">
      <span class="q" id="qual" title="Stream format">—</span>
      <button id="likeNow" title="Love"><svg viewBox="0 0 24 24"><path d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3C19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/></svg></button>
      <button id="qBtn" title="Up next"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm14-2v6l5-3z"/></svg></button>
      <input type="range" id="vol" min="0" max="100" value="80" title="Volume">
    </div>
  </footer>
</div>

<aside class="drawer" id="drawer"><h3>Up Next</h3><div class="sub">Autoplay keeps going with YouTube Music recommendations</div><div class="list" id="qList"></div></aside>

<section class="full" id="full">
  <div class="bg" id="fBg"></div>
  <button class="close" id="fClose" title="Close">⌄</button>
  <div class="in">
    <img class="big" id="fArt" alt="">
    <div class="meta">
      <div class="t" id="fT"></div><div class="a" id="fA"></div>
      <div class="prog"><span id="fCur">0:00</span><input type="range" id="fSeek" min="0" max="1000" value="0"><span id="fDur">0:00</span></div>
      <div class="ctl">
        <button data-act="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
        <button class="pp" data-act="pp"><svg viewBox="0 0 24 24" class="ppIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <button data-act="next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9.5-12h2v12h-2z"/></svg></button>
      </div>
    </div>
  </div>
</section>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>if (window.TUNE_APP) document.write('<script src="engine.js"><\/script><script src="app-bridge.js"><\/script>');</script>
<script>
const APP = window.TuneApp || null; // set when running inside the iPhone app
const $ = s => document.querySelector(s);
const view = $('#view'), audio = APP ? APP.audio : $('#audio');
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3C19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// iPhone/iPad (incl. iPadOS that reports as Mac) or any browser without WebM/Opus → ask for AAC.
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const FMT = (IOS || !document.createElement('audio').canPlayType('audio/webm; codecs="opus"')) ? '?f=aac' : '';
const sm = u => (u || '').replace(/(%3D|=)w544-h544/, '$1w120-h120');
const abs = u => u && u.startsWith('/') ? location.origin + u : u;
const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';
const api = p => APP ? APP.api(p) : fetch(p).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

// ---- local, account-free storage ----
const store = APP ? APP.store : {
  get(k, d) { try { return JSON.parse(localStorage.getItem('tune.'+k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tune.'+k, JSON.stringify(v)); } catch {} },
};
let liked = store.get('liked', []), recent = store.get('recent', []);
const isLiked = id => liked.some(t => t.id === id);
function toggleLike(t) {
  liked = isLiked(t.id) ? liked.filter(x => x.id !== t.id) : [t, ...liked];
  store.set('liked', liked);
  document.querySelectorAll(`.heart[data-id="${t.id}"]`).forEach(h => h.classList.toggle('on', isLiked(t.id)));
  syncLikeNow(); toast(isLiked(t.id) ? 'Added to Library' : 'Removed from Library');
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }

// ---- player state ----
let queue = [], idx = -1, shuffle = false, repeat = false, fetchingMore = false;
const cur = () => queue[idx];

function playList(list, start = 0, autoplayRadio = true) {
  queue = list.slice(); idx = start; load(); if (autoplayRadio && list.length < 5) extendWithRadio();
}
async function extendWithRadio() {
  const seed = queue[queue.length - 1] || cur(); if (!seed || fetchingMore) return;
  fetchingMore = true;
  try {
    const recs = await api('/api/radio/' + seed.id);
    const have = new Set(queue.map(t => t.id));
    queue.push(...recs.filter(t => !have.has(t.id)));
    renderQueue(); APP?.syncUpcoming();
  } catch {} finally { fetchingMore = false; }
}
function load() {
  const t = cur(); if (!t) return;
  if (APP) APP.start(); else { audio.src = '/api/stream/' + t.id + FMT; audio.play().catch(() => {}); }
  showTrack();
}
function showTrack() {
  const t = cur(); if (!t) return;
  $('#npArt').src = t.art || ''; $('#npT').textContent = t.title; $('#npA').textContent = t.artist;
  $('#fArt').src = t.art || ''; $('#fBg').style.backgroundImage = `url("${t.art}")`;
  $('#fT').textContent = t.title; $('#fA').textContent = t.artist;
  document.title = `${t.title} · ${t.artist}`;
  $('#qual').textContent = '…';
  api('/api/info/' + t.id + FMT).then(i => $('#qual').textContent = `${(i.codec||'').toUpperCase()} ${i.kbps}k`).catch(() => {});
  recent = [t, ...recent.filter(x => x.id !== t.id)].slice(0, 60); store.set('recent', recent);
  syncLikeNow(); renderQueue(); markCurrent();
  if (!APP && 'mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album || '', artwork: t.art ? [{ src: abs(t.art), sizes: '544x544' }] : [] });
  }
  if (queue.length - idx < 4) extendWithRadio();
  // prefetch next stream url so skips are instant
  const n = queue[idx + 1]; if (n && !APP) fetch('/api/info/' + n.id + FMT).catch(() => {});
}
function next(auto = false) {
  if (auto && repeat) { audio.currentTime = 0; audio.play(); return; }
  if (shuffle && queue.length > idx + 2) {
    const j = idx + 1 + Math.floor(Math.random() * (queue.length - idx - 1));
    [queue[idx + 1], queue[j]] = [queue[j], queue[idx + 1]];
  }
  if (idx < queue.length - 1) { idx++; load(); } else extendWithRadio().then(() => { if (idx < queue.length - 1) { idx++; load(); } });
}
function prev() { if (audio.currentTime > 3) audio.currentTime = 0; else if (idx > 0) { idx--; load(); } }
function toggle() { if (!cur()) return; audio.paused ? audio.play() : audio.pause(); }
function syncLikeNow() { $('#likeNow').classList.toggle('on', !!cur() && isLiked(cur().id)); $('#likeNow').style.color = cur() && isLiked(cur().id) ? 'var(--accent)' : ''; }
function markCurrent() { document.querySelectorAll('.row[data-id]').forEach(r => r.classList.toggle('cur', !!cur() && r.dataset.id === cur().id)); }

audio.addEventListener('play', () => setPP(true));
audio.addEventListener('pause', () => setPP(false));
audio.addEventListener('ended', () => next(true));
audio.addEventListener('error', () => { if (cur()) { toast('Couldn’t play that one — skipping'); setTimeout(() => next(), 800); } });
audio.addEventListener('timeupdate', () => {
  const p = audio.duration ? audio.currentTime / audio.duration * 1000 : 0;
  for (const [s, c, d] of [['#seek', '#cur', '#dur'], ['#fSeek', '#fCur', '#fDur']]) {
    const el = $(s); if (!el._drag) { el.value = p; el.style.setProperty('--p', p / 10 + '%'); }
    $(c).textContent = fmt(audio.currentTime); $(d).textContent = fmt(audio.duration);
  }
});
function setPP(playing) { $('#ppI').innerHTML = playing ? PAUSE : PLAY; document.querySelectorAll('.ppIcon').forEach(i => i.innerHTML = playing ? PAUSE : PLAY); }
for (const s of ['#seek', '#fSeek']) {
  const el = $(s);
  el.addEventListener('input', () => { el._drag = true; el.style.setProperty('--p', el.value / 10 + '%'); });
  el.addEventListener('change', () => { el._drag = false; if (audio.duration) audio.currentTime = el.value / 1000 * audio.duration; });
}
const vol = $('#vol');
vol.value = store.get('vol', 80); audio.volume = vol.value / 100; vol.style.setProperty('--p', vol.value + '%');
vol.addEventListener('input', () => { audio.volume = vol.value / 100; vol.style.setProperty('--p', vol.value + '%'); store.set('vol', +vol.value); });

$('#pp').onclick = toggle; $('#next').onclick = () => next(); $('#prev').onclick = prev;
$('#shuf').onclick = e => {
  shuffle = !shuffle; e.currentTarget.classList.toggle('on', shuffle);
  if (shuffle && APP) { // iOS plays ahead on its own, so shuffle the rest of the queue now
    for (let i = queue.length - 1; i > idx + 1; i--) { const j = idx + 1 + Math.floor(Math.random() * (i - idx)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
    renderQueue(); APP.syncUpcoming();
  }
};
$('#rep').onclick = e => { repeat = !repeat; e.currentTarget.classList.toggle('on', repeat); APP?.setRepeat(repeat); };
$('#likeNow').onclick = () => cur() && toggleLike(cur());
$('#qBtn').onclick = () => { $('#drawer').classList.toggle('open'); $('#qBtn').classList.toggle('on'); };
$('#npOpen').onclick = () => cur() && $('#full').classList.add('open');
$('#fClose').onclick = () => $('#full').classList.remove('open');
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => ({ pp: toggle, next: () => next(), prev })[b.dataset.act]());
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight' && e.metaKey) next();
  if (e.code === 'ArrowLeft' && e.metaKey) prev();
  if (e.code === 'Escape') $('#full').classList.remove('open');
});
if (!APP && 'mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', () => next());
  navigator.mediaSession.setActionHandler('previoustrack', prev);
}

// ---- rendering ----
function rows(list, { numbered = true, ctx } = {}) {
  if (!list.length) return '<div class="empty">Nothing here yet.</div>';
  const id = 'L' + Math.random().toString(36).slice(2);
  lists[id] = list;
  return `<div class="list" data-list="${id}">` + list.map((t, i) => `
    <div class="row" role="button" tabindex="0" data-i="${i}" data-id="${esc(t.id)}">
      <span class="n">${numbered ? i + 1 : ''}</span>
      <img decoding="async" src="${esc(sm(t.art))}" alt="">
      <div style="min-width:0"><div class="rt">${esc(t.title)}</div><div class="ra">${t.source === 'youtube' ? '<span class="yt">YouTube</span>' : ''}${esc(t.artist)}</div></div>
      <div class="al">${esc(t.album || (t.views ? t.views + ' views' : ''))}</div>
      <button class="heart ${isLiked(t.id) ? 'on' : ''}" data-id="${esc(t.id)}" title="Love">${HEART}</button>
      <span class="d">${esc(t.duration || '')}</span>
    </div>`).join('') + '</div>';
}
const lists = {};
view.addEventListener('click', e => {
  const heart = e.target.closest('.heart');
  const row = e.target.closest('.row');
  if (heart && row) { const l = lists[row.parentElement.dataset.list]; toggleLike(l[+row.dataset.i]); return; }
  if (row) { const l = lists[row.parentElement.dataset.list]; playList(l, +row.dataset.i); return; }
  const c = e.target.closest('.card');
  if (c) {
    const it = cards[c.dataset.k];
    if (it.kind === 'song') { playList([it], 0); }
    else location.hash = `#/${it.kind}/${encodeURIComponent(it.id)}`;
  }
});
const cards = {};
function cardHtml(it) {
  const k = 'C' + Math.random().toString(36).slice(2); cards[k] = it;
  return `<button class="card" data-k="${k}"><div class="art"><img decoding="async" src="${esc(it.art)}" alt=""><span class="play"><svg viewBox="0 0 24 24">${PLAY}</svg></span></div>
    <div class="t">${esc(it.title)}</div><div class="s">${esc(it.artist)}</div></button>`;
}
const spinner = '<div class="spin"></div>';

let homeCache, exploreCache, homeAt = 0;
const HOME_TTL = 30 * 60 * 1000; // refetch charts/new releases every 30 min
async function renderHome() {
  if (Date.now() - homeAt > HOME_TTL) { homeCache = exploreCache = null; }
  if (!homeCache) view.innerHTML = '<h1>Listen Now</h1>' + spinner;
  try {
    if (!homeCache) {
      [homeCache, exploreCache] = await Promise.all([
        api('/api/home'),
        api('/api/explore').catch(() => ({ releases: [], trending: [] })),
      ]);
      // Don't hold on to an incomplete result for 30 min — retry on the next Home visit.
      homeAt = exploreCache.trending.length && exploreCache.releases.length ? Date.now() : 0;
    }
    if (!location.hash.match(/^(#\/home)?$/) && location.hash !== '') return; // navigated away meanwhile
    let html = '<h1>Listen Now</h1>';
    if (exploreCache.releases.length) html += '<h2>New Releases</h2><div class="shelf">' + exploreCache.releases.map(cardHtml).join('') + '</div>';
    if (exploreCache.trending.length) html += `<div class="h2row"><h2>Trending Now</h2><button class="pill ghost sm" id="playTrend">▶ Play all</button></div>` + rows(exploreCache.trending.slice(0, 10));
    if (recent.length) html += '<h2>Recently Played</h2><div class="shelf">' + recent.slice(0, 12).map(t => cardHtml({ ...t, kind: 'song' })).join('') + '</div>';
    for (const s of homeCache) html += `<h2>${esc(s.title)}</h2><div class="shelf">${s.items.map(cardHtml).join('')}</div>`;
    view.innerHTML = html;
    const pt = $('#playTrend'); if (pt) pt.onclick = () => playList(exploreCache.trending, 0);
    markCurrent();
  } catch { view.innerHTML = '<h1>Listen Now</h1><div class="empty">Couldn’t reach YouTube Music. Is the server running?</div>'; }
}
let lastQ = '';
function renderSearch() {
  view.innerHTML = `<h1>Search</h1><label class="searchbox"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input id="q" placeholder="Artists, songs, albums" autocomplete="off" value="${esc(lastQ)}"></label><div id="res"></div>`;
  const q = $('#q'); q.focus();
  let t; q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => doSearch(q.value), 350); });
  if (lastQ) doSearch(lastQ);
}
async function doSearch(q) {
  lastQ = q; const res = $('#res'); if (!res) return;
  if (!q.trim()) { res.innerHTML = ''; return; }
  res.innerHTML = spinner;
  try {
    const r = await api('/api/search?q=' + encodeURIComponent(q));
    if (lastQ !== q) return;
    const songs = r.songs.length ? '<h2>Songs</h2>' + rows(r.songs) : '';
    const albums = r.albums.length ? '<h2>Albums</h2><div class="shelf">' + r.albums.map(cardHtml).join('') + '</div>' : '';
    const yt = (r.youtube || []).length ? '<h2>From YouTube <span class="sub2">not on YouTube Music</span></h2>' + rows(r.youtube) : '';
    // If YouTube Music has nothing, lead with the YouTube results.
    res.innerHTML = (r.songs.length ? songs + albums + yt : yt + albums) || '<div class="empty">No results.</div>';
    markCurrent();
  } catch { res.innerHTML = '<div class="empty">Search failed. Try again.</div>'; }
}
function renderLib() {
  view.innerHTML = `<div class="hero"><div><div class="k">Library</div><h1>Loved Songs</h1><div class="by">${liked.length} song${liked.length === 1 ? '' : 's'} · saved on this device</div>
    ${liked.length ? '<div class="btns"><button class="pill" id="pa">▶ Play</button><button class="pill ghost" id="sa">Shuffle</button></div>' : ''}</div></div>` + rows(liked);
  if (liked.length) { $('#pa').onclick = () => playList(liked, 0, false); $('#sa').onclick = () => playList([...liked].sort(() => Math.random() - .5), 0, false); }
  markCurrent();
}
function renderRecent() { view.innerHTML = '<h1>Recently Played</h1>' + rows(recent); markCurrent(); }
async function renderCollection(kind, id) {
  view.innerHTML = spinner;
  try {
    const c = await api(`/api/collection/${kind}/${encodeURIComponent(id)}`);
    view.innerHTML = `<div class="hero"><img src="${esc(c.art)}" alt=""><div><div class="k">${kind}</div><h1>${esc(c.title)}</h1>
      <div class="by">${esc(c.artist)}${c.year ? ' · ' + esc(c.year) : ''}</div>
      <div class="btns"><button class="pill" id="pa">▶ Play</button><button class="pill ghost" id="sa">Shuffle</button></div></div></div>` + rows(c.tracks);
    $('#pa').onclick = () => playList(c.tracks, 0);
    $('#sa').onclick = () => playList([...c.tracks].sort(() => Math.random() - .5), 0);
    markCurrent();
  } catch { view.innerHTML = '<div class="empty">Couldn’t load this.</div>'; }
}
function renderQueue() {
  const el = $('#qList'), up = queue.slice(idx);
  el.innerHTML = up.map((t, i) => `<div class="row ${i === 0 ? 'cur' : ''}" role="button" data-q="${idx + i}"><img decoding="async" src="${esc(sm(t.art))}" alt="">
    <div style="min-width:0"><div class="rt">${esc(t.title)}</div><div class="ra">${esc(t.artist)}</div></div><span class="d">${esc(t.duration || '')}</span></div>`).join('');
}
$('#qList').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) { idx = +r.dataset.q; load(); } });

function route() {
  const [, a, b, c] = location.hash.split('/');
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.go === (a || 'home')));
  view.scrollTop = 0;
  if (a === 'search') renderSearch();
  else if (a === 'library') renderLib();
  else if (a === 'recent') renderRecent();
  else if (a === 'album' || a === 'playlist') renderCollection(a, decodeURIComponent(b));
  else renderHome();
}
document.querySelectorAll('.nav').forEach(n => n.onclick = () => location.hash = '#/' + n.dataset.go);
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
